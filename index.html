<!doctype html>
<html data-theme="codingjr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodingJr Bot Lab</title>
    <link rel="shortcut icon" href="img/favicon.ico" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "codingjr";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <!-- codingjr:entry:start -->
    <script type="module" src="/src/main.js"></script>
    <!-- codingjr:entry:end -->
  </head>

  <body
    class="min-h-screen bg-base-200 text-base-content flex items-center justify-center"
  >
    <div id="audioContainer">
      <audio id="audioPlayer" preload="auto"></audio>
    </div>

    <div id="codingjr-app" class="relative w-[980px] h-[740px]">
      <div

            135deg,
            #fdfbf7 0%,
            #ffffff 45%,
            #ecf8fa 100%

        "

          <svg

            height="220"
            viewBox="0 0 220 220"

            xmlns="http://www.w3.org/2000/svg"

            />

        <div class="absolute bottom-0 right-0 pointer-events-none opacity-40">

            <path
              d="M220 180 H160 L120 140 H60 L30 110 V60"
              stroke="#7dd3fc"
              stroke-width="2"
              stroke-linecap="round"
            />

              stroke-linecap="round"

            <circle cx="70" cy="20" r="4" fill="#38bdf8" />
            <path
              d="M220 210 H130 L90 170 H40"
              stroke="#94a3b8"
              stroke-width="1.5"
              stroke-dasharray="4 4"
              stroke-linecap="round"
            />
            <circle cx="40" cy="170" r="3" fill="#94a3b8" />
          </svg>

            class="h-12 md:h-14 w-auto max-w-[240px] object-contain drop-shadow-sm transition-transform duration-300 hover:scale-105"
          />

        <!-- Title & Subtitle -->
        <div class="text-center px-4 -mt-4">
          <h1
            class="text-2xl md:text-4xl font-black text-slate-900 tracking-tight"
            data-i18n="welcomeScreen.title"
          >
            Welcome to the Lab
          </h1>
          <p
            class="text-sm md:text-base text-slate-600 mt-2 font-semibold"
            data-i18n="welcomeScreen.subtitle"
          >
            Learn logical thinking and programming with fun challenges.
          </p>
        </div>

        <!-- Central Robot Graphic -->
        <div
          class="flex items-center justify-center my-auto py-2 w-full max-w-[580px]"

            src="img/robot.webp"
            alt="CodingJr Robot Mascot"
            class="w-full max-h-[250px] object-contain drop-shadow-md select-none pointer-events-none transition-transform duration-300 hover:scale-105"

        <!-- Bottom Floating Navigation Dock / Capsule -->

          <div
            class="bg-slate-200/85 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-2 px-3 shadow-xl border border-white/70 dark:border-slate-700/60 flex items-center justify-between gap-3 w-full max-w-[840px]"

                viewBox="0 0 20 20"
                fill="currentColor"
                class="size-4 text-slate-700 dark:text-slate-200"

                  d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0v-.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM8 8a2 2 0 1 1 3.938.5c-.066.329-.35.65-.65.9-.344.286-.62.515-.71.722-.113.26-.078.47-.078.628a.75.75 0 0 1-1.5 0c0-.332.062-.714.288-1.077.21-.336.527-.6.82-.843.203-.17.392-.328.434-.492A.5.5 0 0 0 10 7.5a.5.5 0 0 0-.5.5.75.75 0 0 1-1.5 0A2 2 0 0 1 8 8Z"

            </button>

            <!-- MY TRACKS Button -->

            >

                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="size-4 text-slate-700 dark:text-slate-200"

            </button>

            <!-- START LAB SESSION Button -->

                  clip-rule="evenodd"
                />

              <span class="text-xs font-semibold whitespace-nowrap">Language: English</span>
            </div>

            <!-- SETTINGS Dropdown -->
            <div id="settingsDropdown" class="dropdown dropdown-top dropdown-end">
              <button
                type="button"
                id="settingsDropdownBtn"
                class="btn btn-ghost btn-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-slate-700/60 rounded-xl px-2.5 gap-1.5 normal-case text-sm cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  class="size-4"
                >
                  <path
                    fill-rule="evenodd"
                    d="M7.84 1.804A1 1 0 0 1 8.82 1h2.36a1 1 0 0 1 .98.804l.331 1.652a6.993 6.993 0 0 1 1.929 1.115l1.598-.54a1 1 0 0 1 1.186.447l1.18 2.044a1 1 0 0 1-.205 1.251l-1.267 1.113a7.047 7.047 0 0 1 0 2.228l1.267 1.113a1 1 0 0 1 .206 1.25l-1.18 2.045a1 1 0 0 1-1.187.447l-1.598-.54a6.993 6.993 0 0 1-1.929 1.115l-.33 1.652a1 1 0 0 1-.98.804H8.82a1 1 0 0 1-.98-.804l-.331-1.652a6.993 6.993 0 0 1-1.929-1.115l-1.598.54a1 1 0 0 1-1.186-.447l-1.18-2.044a1 1 0 0 1 .205-1.251l1.267-1.114a7.05 7.05 0 0 1 0-2.227L1.821 7.773a1 1 0 0 1-.206-1.25l1.18-2.045a1 1 0 0 1 1.187-.447l1.598.54A6.993 6.993 0 0 1 7.51 3.456l.33-1.652ZM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                    clip-rule="evenodd"
                  />
                </svg>
                <span data-i18n="welcomeScreen.settings">Settings</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  class="size-3 opacity-60"
                >
                  <path
                    fill-rule="evenodd"
                    d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                    clip-rule="evenodd"
                  />
                </svg>
              </button>
              <div

                class="dropdown-content menu p-3 shadow-2xl bg-base-100/95 backdrop-blur-md rounded-2xl w-60 border border-base-300 mb-2 space-y-2.5 z-50"
              >
                <div class="flex items-center justify-between px-1">
                  <span
                    class="text-xs font-bold uppercase opacity-70"
                    data-i18n="welcomeScreen.toggleAudio"

                  <button
                    class="audioToggleButton btn btn-xs btn-circle btn-ghost"
                    data-i18n-title="welcomeScreen.toggleAudio"

                  >
                    <svg
                      class="cjr-audio-on hidden size-4"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 20 20"
                      fill="currentColor"

                      <path
                        d="M10.5 3.75a.75.75 0 0 0-1.264-.546L5.203 7H2.667a.75.75 0 0 0-.7.48A6.985 6.985 0 0 0 1.5 10c0 .887.165 1.737.468 2.52.111.29.39.48.7.48h2.535l4.033 3.796a.75.75 0 0 0 1.264-.546V3.75ZM16.45 5.05a.75.75 0 0 0-1.06 1.061 5.5 5.5 0 0 1 0 7.778.75.75 0 0 0 1.06 1.06 7 7 0 0 0 0-9.899Z"
                      />
                    </svg>
                    <svg
                      class="cjr-audio-off size-4"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 20 20"
                      fill="currentColor"
                    >
                      <path
                        d="M10.047 3.062a.75.75 0 0 1 .453.688v12.5a.75.75 0 0 1-1.264.546L5.203 13H2.667a.75.75 0 0 1-.7-.48A6.985 6.985 0 0 1 1.5 10c0-.887.165-1.737.468-2.52a.75.75 0 0 1 .7-.48h2.535l4.033-3.796a.75.75 0 0 1 .811-.142ZM13.78 7.22a.75.75 0 1 0-1.06 1.06L14.44 10l-1.72 1.72a.75.75 0 0 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L16.56 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L15.5 8.94l-1.72-1.72Z"
                      />
                    </svg>
                  </button>
                </div>
                <div class="px-1">
                  <label
                    class="text-xs font-bold uppercase opacity-70 block mb-1"
                    data-i18n="welcomeScreen.theme"
                    >Theme</label
                  >
                  <select
                    data-choose-theme
                    class="select select-bordered select-xs w-full"
                  >
                    <option value="codingjr">codingjr</option>
                    <option value="light">light</option>
                    <option value="dark">dark</option>

                    <option value="dracula">dracula</option>

                    <option value="lemonade">lemonade</option>
                    <option value="night">night</option>
                    <option value="coffee">coffee</option>
                    <option value="winter">winter</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="achievementsScreen"
        class="cjr-screen hidden absolute top-5 inset-x-0 bottom-4 rounded-box bg-base-100 shadow p-6 flex flex-col gap-4"
      >
        <h1
          class="text-3xl font-black uppercase"
          data-i18n="achievementsScreen.title"
        ></h1>
        <ul
          id="achievementsList"
          class="list bg-base-200 rounded-box shadow overflow-auto"
        ></ul>
        <div class="mt-auto">
          <button class="mainMenuButton btn btn-sm gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="size-4 fill-current"
            >
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5Z" />
            </svg>
            <span data-i18n="achievementsScreen.mainMenu"></span>
          </button>
        </div>
      </div>

      <div
        id="helpScreen"
        class="cjr-screen hidden absolute top-5 inset-x-0 bottom-4 rounded-box bg-base-100 shadow p-6"
      >
        <div class="grid grid-cols-[1fr_12px_400px] gap-6 h-full">
          <div
            id="helpScreenAccordion"
            class="space-y-2 overflow-auto pr-2 text-sm"
          >
            <div
              class="collapse collapse-arrow bg-base-200 rounded-box"
              data-video="0"
            >
              <input type="radio" name="help-accordion" checked="checked" />
              <div
                class="collapse-title font-bold"
                data-i18n="helpScreen.goal.title"
              ></div>
              <div class="collapse-content">
                <p data-i18n="helpScreen.goal.content"></p>

            </div>
            <div

              data-video="1"
            >
              <input type="radio" name="help-accordion" />
              <div

                data-i18n="helpScreen.howTo.title"
              ></div>
              <div class="collapse-content">
                <p data-i18n="helpScreen.howTo.content"></p>
              </div>
            </div>
            <div
              class="collapse collapse-arrow bg-base-200 rounded-box"
              data-video="2"
            >
              <input type="radio" name="help-accordion" />

            </div>
            <div

            </div>
            <div

            >
              <input type="radio" name="help-accordion" />
              <div
                class="collapse-title font-bold"
                data-i18n="helpScreen.turnRight.title"

              <div class="collapse-content">
                <p data-i18n="helpScreen.turnRight.content"></p>
              </div>
            </div>
            <div
              class="collapse collapse-arrow bg-base-200 rounded-box"
              data-video="5"
            >
              <input type="radio" name="help-accordion" />
              <div
                class="collapse-title font-bold"

            <div

            </div>
            <div

            >
              <input type="radio" name="help-accordion" />
              <div
                class="collapse-title font-bold"
                data-i18n="helpScreen.light.title"
              ></div>
              <div class="collapse-content">
                <p data-i18n="helpScreen.light.content"></p>
              </div>
            </div>
            <div

        <div class="mt-auto">

              <canvas

              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  class="size-4 fill-current"
                >
                  <path
                    d="M19 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H19v-2Z"
                  />
                </svg>
              </button>
              <button
                class="audioToggleButton btn btn-sm btn-square"
                data-i18n-title="gameScreen.toggleAudio"
                title="Toggle audio"
              >
                <svg
                  class="cjr-audio-on hidden size-5"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    d="M10.5 3.75a.75.75 0 0 0-1.264-.546L5.203 7H2.667a.75.75 0 0 0-.7.48A6.985 6.985 0 0 0 1.5 10c0 .887.165 1.737.468 2.52.111.29.39.48.7.48h2.535l4.033 3.796a.75.75 0 0 0 1.264-.546V3.75ZM16.45 5.05a.75.75 0 0 0-1.06 1.061 5.5 5.5 0 0 1 0 7.778.75.75 0 0 0 1.06 1.06 7 7 0 0 0 0-9.899Z"
                  />
                  <path
                    d="M14.329 7.172a.75.75 0 0 0-1.061 1.06 2.5 2.5 0 0 1 0 3.536.75.75 0 0 0 1.06 1.06 4 4 0 0 0 0-5.656Z"
                  />
                </svg>
                <svg
                  class="cjr-audio-off size-5"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    d="M10.047 3.062a.75.75 0 0 1 .453.688v12.5a.75.75 0 0 1-1.264.546L5.203 13H2.667a.75.75 0 0 1-.7-.48A6.985 6.985 0 0 1 1.5 10c0-.887.165-1.737.468-2.52a.75.75 0 0 1 .7-.48h2.535l4.033-3.796a.75.75 0 0 1 .811-.142ZM13.78 7.22a.75.75 0 1 0-1.06 1.06L14.44 10l-1.72 1.72a.75.75 0 0 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L16.56 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L15.5 8.94l-1.72-1.72Z"
                  />
                </svg>
              </button>
              <button
                id="clearButton"
                class="btn btn-sm btn-square"
                data-i18n-title="gameScreen.clear"
                title="Clear"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                  class="size-4"
                >
                  <path
                    fill-rule="evenodd"
                    d="M5 3.25V4H2.75a.75.75 0 0 0 0 1.5h.3l.815 8.15A1.5 1.5 0 0 0 5.357 15h5.285a1.5 1.5 0 0 0 1.493-1.35l.815-8.15h.3a.75.75 0 0 0 0-1.5H11v-.75A2.25 2.25 0 0 0 8.75 1h-1.5A2.25 2.25 0 0 0 5 3.25Zm2.25-.75a.75.75 0 0 0-.75.75V4h3v-.75a.75.75 0 0 0-.75-.75h-1.5ZM6.05 6a.75.75 0 0 1 .787.713l.275 5.5a.75.75 0 0 1-1.498.075l-.275-5.5A.75.75 0 0 1 6.05 6Zm3.9 0a.75.75 0 0 1 .712.787l-.275 5.5a.75.75 0 0 1-1.498-.075l.275-5.5a.75.75 0 0 1 .786-.711Z"
                    clip-rule="evenodd"
                  />
                </svg>
              </button>
              <button
                id="runButton"
                class="btn btn-sm btn-primary btn-square"
                data-i18n-title="gameScreen.run"
                title="Run"
              >
                <svg
                  class="cjr-run-icon size-4 fill-current"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path d="M8 5v14l11-7-11-7Z" />
                </svg>
                <svg
                  class="cjr-stop-icon hidden size-4 fill-current"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path d="M6 6h12v12H6V6Z" />
                </svg>
              </button>
              <div id="speedControl" class="flex items-center gap-2 pl-2">
                <label
                  for="speedSlider"
                  class="text-sm font-semibold"
                  data-i18n="gameScreen.speed"
                ></label>
                <input
                  id="speedSlider"
                  type="range"
                  min="0.5"
                  max="3.0"
                  step="0.01"
                  value="2"
                  class="range range-xs range-primary w-28"
                />
              </div>
            </div>
          </div>
          <div class="flex flex-col gap-2 min-h-0">
            <div id="instructionsContainer" class="card bg-base-200 shadow">
              <div class="card-body p-3">
                <h2 class="card-title text-base">
                  <span data-i18n="instructions.title"></span>
                </h2>
                <div class="overflow-auto max-h-[220px]">
                  <ul class="space-y-0">
                    <li class="cjr-instruction">
                      <p class="walk cjr-instruction-row">
                        <span
                          class="cjr-instruction-label"
                          data-i18n="instructions.walk"
                        ></span>
                        <button
                          type="button"
                          class="cjr-instruction-delete btn btn-ghost btn-xs btn-square"
                          title="Remove"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            class="size-4 fill-current"
                          >
                            <path
                              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
                            />
                          </svg>
                        </button>
                      </p>
                    </li>
                    <li class="cjr-instruction">
                      <p class="turnRight cjr-instruction-row">
                        <span
                          class="cjr-instruction-label"
                          data-i18n="instructions.turnRight"
                        ></span>
                        <button
                          type="button"
                          class="cjr-instruction-delete btn btn-ghost btn-xs btn-square"
                          title="Remove"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            class="size-4 fill-current"
                          >
                            <path
                              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
                            />
                          </svg>
                        </button>
                      </p>
                    </li>
                    <li class="cjr-instruction">
                      <p class="turnLeft cjr-instruction-row">
                        <span
                          class="cjr-instruction-label"
                          data-i18n="instructions.turnLeft"
                        ></span>
                        <button
                          type="button"
                          class="cjr-instruction-delete btn btn-ghost btn-xs btn-square"
                          title="Remove"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            class="size-4 fill-current"
                          >
                            <path
                              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
                            />
                          </svg>
                        </button>
                      </p>
                    </li>
                    <li class="cjr-instruction">
                      <p class="jump cjr-instruction-row">
                        <span
                          class="cjr-instruction-label"
                          data-i18n="instructions.jump"
                        ></span>
                        <button
                          type="button"
                          class="cjr-instruction-delete btn btn-ghost btn-xs btn-square"
                          title="Remove"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            class="size-4 fill-current"
                          >
                            <path
                              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
                            />
                          </svg>
                        </button>
                      </p>
                    </li>
                    <li class="cjr-instruction">
                      <p class="light cjr-instruction-row">
                        <span
                          class="cjr-instruction-label"
                          data-i18n="instructions.light"
                        ></span>
                        <button
                          type="button"
                          class="cjr-instruction-delete btn btn-ghost btn-xs btn-square"
                          title="Remove"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            class="size-4 fill-current"
                          >
                            <path
                              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
                            />
                          </svg>
                        </button>
                      </p>
                    </li>
                    <li class="cjr-instruction">
                      <p class="repeat cjr-instruction-row">
                        <span class="cjr-repeat-left flex items-center gap-2">
                          <span
                            class="cjr-instruction-label"
                            data-i18n="instructions.repeat.label"
                          ></span>
                          <span
                            class="cjr-repeat-count flex items-center gap-2"
                          >
                            <input
                              type="number"
                              min="1"
                              max="99"
                              step="1"
                              value="2"
                              class="input input-bordered input-xs w-16"
                            />
                            <span
                              class="text-xs opacity-70"
                              data-i18n="instructions.repeat.times"
                            ></span>
                          </span>
                        </span>
                        <button
                          type="button"
                          class="cjr-instruction-delete btn btn-ghost btn-xs btn-square"
                          title="Remove"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            class="size-4 fill-current"
                          >
                            <path
                              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
                            />
                          </svg>
                        </button>
                      </p>
                      <div class="cjr-repeat-body droppable">
                        <div class="cjr-repeat-body-inner">
                          <ul class="space-y-2"></ul>
                        </div>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <div
              id="programContainer"
              class="card bg-base-200 shadow flex-1 min-h-0"
            >
              <div class="card-body p-3 min-h-0">
                <h2 class="card-title text-base">
                  <span data-i18n="program.title"></span>
                </h2>
                <div
                  class="droppable flex-1 overflow-x-hidden overflow-y-auto min-h-0"
                >
                  <ul class="space-y-0 min-h-[360px]"></ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="credits2"
        class="absolute bottom-0 inset-x-0 h-4 text-center text-xs opacity-70"
      >
        <div style="float: left"></div>
        <div style="float: right"></div>
      </div>
    </div>

    <dialog id="levelCompleteDialog" class="modal">
      <div class="modal-box">
        <h3
          class="font-bold text-lg"
          data-i18n="dialogs.levelComplete.title"
        ></h3>
        <div class="py-4 flex gap-3 items-start">
          <span class="medal shrink-0"></span>
          <div class="flex-1">
            <p class="message" data-i18n="dialogs.levelComplete.message"></p>
            <p class="hint mt-2 text-sm opacity-80"></p>
          </div>
        </div>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn btn-sm">OK</button>
          </form>
        </div>
      </div>
    </dialog>

    <dialog id="achievementDialog" class="modal">
      <div class="modal-box">
        <h3
          class="font-bold text-lg"
          data-i18n="dialogs.achievement.title"
        ></h3>
        <div class="py-4 flex gap-3 items-start">
          <span class="achievement shrink-0"></span>
          <p class="message flex-1"></p>
        </div>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn btn-sm">OK</button>
          </form>
        </div>
      </div>
    </dialog>
  </body>
</html>
